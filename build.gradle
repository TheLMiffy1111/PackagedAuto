plugins {
	id "com.crystaelix.loom-no-remap" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "net.mezzdev.config"
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/releases/"
			}
		}
		filter {
			includeGroup "dev.emi"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://modmaven.dev/"
			}
		}
		filter {
			includeGroup "mekanism"
		}
	}
}

def mcVersion = "26.1.2"
def modName = "PackagedAuto"
def modId = "packagedauto"
def specVersion = "5"
def vendor = "thelm"

group = "thelm.packagedauto"
version = "5.0.0.0"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	runs {
		configureEach {
			property "forge.logging.console.level", "debug"
		}
		client
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:26.1.2"
	neoForge "net.neoforged:neoforge:26.1.2.127"

	// Dependencies
	implementation("net.mezzdev.config:mezz_config-26.1.2-neoforge:0.7.1") {transitive = false}
	implementation("mezz.jei:jei-26.1.2-neoforge:29.53.0.115") {transitive = false}
	implementation "org.appliedenergistics:guideme:26.1.17-beta"
	implementation "org.appliedenergistics:appliedenergistics2:26.1.13-beta"
	implementation "vazkii.patchouli:patchouli-neoforge:26.1-94"
	implementation "curse.maven:mouse-tweaks-60089:7840778"

	// Testing
	implementation "curse.maven:cucumber-272335:9459215"
	implementation "curse.maven:extended-crafting-268387:9042099"
	implementation "curse.maven:mekanism-version-locked-1713956:9267959"
	implementation "curse.maven:applied-mekanistics-version-locked-1742374:9153209"

	//Performance
	implementation "curse.maven:yeetusexperimentus-635427:7830957"
	implementation "curse.maven:modernfix-790626:8774761"
	implementation "curse.maven:ferritecore-429235:7806039"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact jar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = jar.archiveFile
	version = displayName = "${mcVersion}-${project.version}"
	changelog = file("changelog.md").text
	type = BETA
	modLoaders.add("neoforge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "308380"
		minecraftVersions.add(mcVersion)
		client = true
		server = true
		optional "applied-energistics-2", "jei", "patchouli"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "ugIdhQx4"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_AND_SERVER
		optional "ae2", "jei", "patchouli"
	}
}
